services:
  postgres:
    image: postgres:16-alpine
    container_name: artedu-postgres
    environment:
      POSTGRES_DB: artedu
      POSTGRES_USER: artedu
      POSTGRES_PASSWORD: artedu_dev_only
    ports:
      - "5432:5432"
    volumes:
      - artedu_postgres_data:/var/lib/postgresql/data
      - ./migrations/0001_initial.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artedu -d artedu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artedu_postgres_data:
