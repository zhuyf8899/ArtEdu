services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: artedu
      POSTGRES_USER: artedu
      POSTGRES_PASSWORD: ${ARTEDU_POSTGRES_PASSWORD:?Set ARTEDU_POSTGRES_PASSWORD in .env}
    volumes:
      - artedu_staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artedu -d artedu"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      ARTEDU_ENV_LABEL: ${ARTEDU_ENV_LABEL:-staging}
      ARTEDU_VERSION: ${ARTEDU_VERSION:-unversioned}
      CASE_VIDEO_MAX_MIB: ${CASE_VIDEO_MAX_MIB:-100}
      DATABASE_URL: postgresql://artedu:${ARTEDU_POSTGRES_PASSWORD}@postgres:5432/artedu
      HOST: 0.0.0.0
      PORT: 4000
      CORS_ORIGIN: ${ARTEDU_CORS_ORIGIN:?Set ARTEDU_CORS_ORIGIN in .env},http://127.0.0.1:18080,http://localhost:18080
      ENABLE_LOCAL_AUTH: "true"
      ARTEDU_ALLOW_TEST_ACCOUNTS: "true"
      LOCAL_SESSION_DAYS: 7
      LOCAL_SESSION_IDLE_HOURS: 12
      ENABLE_FILE_UPLOADS: "true"
      UPLOAD_ROOT: /data/uploads
      # Runtime-only configuration: never bake provider credentials into images or the web bundle.
      MODEL_EXECUTION_ENABLED: ${MODEL_EXECUTION_ENABLED:-false}
      MODEL_PROVIDERS_JSON: ${MODEL_PROVIDERS_JSON:-[]}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 备用 key：主 key 失效/欠费（HTTP 401/402/403）时自动接管，逻辑见
      # apps/api/src/modules/generation/provider-api-keys.ts。
      DEEPSEEK_API_KEY_FALLBACK: ${DEEPSEEK_API_KEY_FALLBACK:-}
      # ModelScope（魔搭）文生图；同样只从服务器 .env 注入，不写入镜像。
      MODELSCOPE_API: ${MODELSCOPE_API:-}
      # OpenAI Images 兼容的校内/云端图片服务；名称固定，方便安全地注入容器。
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      # Internet search runs through DeepSeek's native web search (Anthropic-compatible
      # Messages endpoint): discovery and page extraction both happen provider-side, so this
      # deployment needs neither a local search service nor a Chromium crawler. The key is
      # shared with the chat model (DEEPSEEK_API_KEY above); only the endpoint differs.
      WEB_SEARCH_TIMEOUT_MS: ${WEB_SEARCH_TIMEOUT_MS:-25000}
      DEEPSEEK_SEARCH_BASE_URL: ${DEEPSEEK_SEARCH_BASE_URL:-}
      DEEPSEEK_SEARCH_MODEL: ${DEEPSEEK_SEARCH_MODEL:-}
      DEEPSEEK_SEARCH_MAX_USES: ${DEEPSEEK_SEARCH_MAX_USES:-}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1024}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.62}
      RAG_WEB_FALLBACK_ENABLED: ${RAG_WEB_FALLBACK_ENABLED:-true}
    volumes:
      - artedu_staging_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  rag-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    command: ["node", "dist/rag.worker.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://artedu:${ARTEDU_POSTGRES_PASSWORD}@postgres:5432/artedu
      ENABLE_FILE_UPLOADS: "true"
      UPLOAD_ROOT: /data/uploads
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1024}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.62}
      RAG_WEB_FALLBACK_ENABLED: ${RAG_WEB_FALLBACK_ENABLED:-true}
    volumes:
      - artedu_staging_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${ARTEDU_BIND_IP:-127.0.0.1}:${ARTEDU_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  artedu_staging_postgres:
  artedu_staging_uploads:
