services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: artedu
      POSTGRES_USER: artedu
      POSTGRES_PASSWORD: ${ARTEDU_POSTGRES_PASSWORD:?Set ARTEDU_POSTGRES_PASSWORD in .env}
    volumes:
      - artedu_staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artedu -d artedu"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://artedu:${ARTEDU_POSTGRES_PASSWORD}@postgres:5432/artedu
      HOST: 0.0.0.0
      PORT: 4000
      CORS_ORIGIN: http://8.212.153.167:8080
      ENABLE_LOCAL_AUTH: "true"
      ARTEDU_ALLOW_TEST_ACCOUNTS: "true"
      LOCAL_SESSION_DAYS: 7
      LOCAL_SESSION_IDLE_HOURS: 12
      ENABLE_FILE_UPLOADS: "true"
      UPLOAD_ROOT: /data/uploads
      # Runtime-only configuration: never bake provider credentials into images or the web bundle.
      MODEL_EXECUTION_ENABLED: ${MODEL_EXECUTION_ENABLED:-false}
      MODEL_PROVIDERS_JSON: ${MODEL_PROVIDERS_JSON:-[]}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # ModelScope（魔搭）文生图；同样只从服务器 .env 注入，不写入镜像。
      MODELSCOPE_API: ${MODELSCOPE_API:-}
      # Internal-only internet-search chain. The DeepSeek fallback is intentionally
      # opt-in because the standard public API does not provide a documented web-search tool.
      WEB_SEARCH_URL: http://websearch:8081/search
      CRAWL4AI_BASE_URL: http://crawler:11235
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Set CRAWL4AI_API_TOKEN in .env}
      WEB_SEARCH_TIMEOUT_MS: ${WEB_SEARCH_TIMEOUT_MS:-20000}
      DEEPSEEK_SEARCH_URL: ${DEEPSEEK_SEARCH_URL:-}
      DEEPSEEK_SEARCH_API_KEY: ${DEEPSEEK_SEARCH_API_KEY:-}
    volumes:
      - artedu_staging_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  websearch:
    build:
      context: .
      dockerfile: deploy/Dockerfile.websearch
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  crawler:
    image: unclecode/crawl4ai:0.9.3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=999,gid=999,mode=1777
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    environment:
      CRAWL4AI_HOOKS_ENABLED: "false"
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Set CRAWL4AI_API_TOKEN in .env}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:11235/health')\""]
      interval: 15s
      timeout: 5s
      retries: 8

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${ARTEDU_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  artedu_staging_postgres:
  artedu_staging_uploads:
