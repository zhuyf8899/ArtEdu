server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  # API accepts a single upload up to 10 MiB; nginx must not reject it before Fastify validates it.
  client_max_body_size 11m;

  # Only case asset uploads may carry large videos; allow multipart overhead.
  # API still enforces per-type limits (10 MiB non-video, up to 100 MiB video).
  location ~ ^/api/works/[^/]+/assets$ {
    client_max_body_size 101m;
    client_body_timeout 120s;
    proxy_request_buffering off;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 教学课件里可能有课堂录屏视频（API 按类型限额：视频 100 MiB，其他 10 MiB）。
  location ~ ^/api/admin/courses/[^/]+/resources$ {
    client_max_body_size 101m;
    client_body_timeout 120s;
    proxy_request_buffering off;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # 流式执行（SSE）：正文增量必须逐帧透传。nginx 默认 proxy_buffering on
  # 会把增量攒成一大块，前端就完全看不到逐字输出了。
  # （控制器另有 X-Accel-Buffering: no 兜底，这里显式关掉更稳。）
  # 不带尾斜杠的 POST /api/agent-runs 用于创建 Run。若只匹配
  # /api/agent-runs/，nginx 会把它当静态目录并回 301，浏览器会在
  # 重定向后丢掉 POST 正文，前端最终只能看到“无法连接服务”。
  location ^~ /api/agent-runs {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 仅图片工作流节点可能长时间等待 ModelScope 队列，其余 API 保持常规超时。
  location ~ ^/api/workflow-runs/[^/]+/execute$ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_read_timeout 660s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    # Image submission, polling and download can exceed the text model window.
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 入口 HTML 和 SPA 路由回退不能被浏览器长期缓存：每次发布都会更新
  # 带 hash 的 JS 文件名。若旧 index.html 仍引用已替换的动态模块，页面会白屏。
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
