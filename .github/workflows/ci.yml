name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            admin-console/package-lock.json
      - run: cd apps/api && npm ci
      - run: cd admin-console && npm ci
      - run: cd apps/api && npm audit --omit=dev --audit-level=high
      - run: cd admin-console && npm audit --omit=dev --audit-level=high
      - run: cd apps/api && npm run test:security
      - run: npm run check
