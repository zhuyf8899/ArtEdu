services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: artedu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: artedu
      POSTGRES_USER: artedu
      POSTGRES_PASSWORD: artedu_dev_only
    ports:
      - "127.0.0.1:${ARTEDU_POSTGRES_PORT:-5432}:5432"
    volumes:
      - artedu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artedu -d artedu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artedu_postgres_data:
