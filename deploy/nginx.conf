server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  # API accepts a single upload up to 10 MiB; nginx must not reject it before Fastify validates it.
  client_max_body_size 10m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # 流式执行（SSE）：正文增量必须逐帧透传。nginx 默认 proxy_buffering on
  # 会把增量攒成一大块，前端就完全看不到逐字输出了。
  # （控制器另有 X-Accel-Buffering: no 兜底，这里显式关掉更稳。）
  location /api/agent-runs/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    # Image submission, polling and download can exceed the text model window.
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
